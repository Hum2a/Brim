<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Brim  true journey cost</title>
  <desc id="desc">Dark cinematic instrument: pump total in amber, glass panel, night wash.</desc>
  <defs>
    <radialGradient id="wash" cx="18%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#8BA3C7" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#E8B33C" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#14171A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#14171A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#ground)"/>
  <rect width="1280" height="640" fill="url(#wash)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="72" y="88" width="1136" height="464" rx="2" fill="rgba(20,23,26,0.55)" stroke="rgba(242,240,235,0.14)"/>
  <text x="104" y="148" fill="#8BA3C7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="0.18em">TRUE JOURNEY COST</text>
  <text x="104" y="214" fill="#F2F0EB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">Crawley ’ London</text>
  <text x="104" y="360" fill="#E8B33C" font-family="ui-monospace, monospace" font-size="96" font-weight="700" filter="url(#soft)">£ 47</text>
  <text x="104" y="412" fill="#8BA3C7" font-family="ui-monospace, monospace" font-size="22">£39£58 · official mpg · live forecourt</text>
  <rect x="104" y="448" width="168" height="36" rx="2" fill="#1F6F63"/>
  <text x="188" y="472" text-anchor="middle" fill="#F2F0EB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">official</text>
  <text x="1176" y="148" text-anchor="end" fill="#F2F0EB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="0.08em">BRIM</text>
  <text x="1176" y="180" text-anchor="end" fill="#8BA3C7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">UK · dark only · no ads</text>
</svg>
